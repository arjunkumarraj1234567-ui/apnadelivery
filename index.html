<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  signOut,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy,
  serverTimestamp,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
   =========================================================
   YAHAN APNE FIREBASE PROJECT KA EXISTING CONFIG PASTE KARO.
*/

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_AUTH_DOMAIN",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   ADMIN
   ========================================================= */

const ADMIN_EMAILS = [
  "arjunpaawan12@gmail.com"
];


/* =========================================================
   PRODUCTS
   ========================================================= */

let products = [
  {
    id:"p1",
    name:"Rice 5 KG",
    price:350,
    category:"Grocery",
    emoji:"🍚"
  },
  {
    id:"p2",
    name:"Wheat Flour 5 KG",
    price:280,
    category:"Grocery",
    emoji:"🌾"
  },
  {
    id:"p3",
    name:"Milk 1 Litre",
    price:65,
    category:"Daily",
    emoji:"🥛"
  },
  {
    id:"p4",
    name:"Bread",
    price:45,
    category:"Daily",
    emoji:"🍞"
  },
  {
    id:"p5",
    name:"Burger",
    price:120,
    category:"Food",
    emoji:"🍔"
  },
  {
    id:"p6",
    name:"Pizza",
    price:220,
    category:"Food",
    emoji:"🍕"
  },
  {
    id:"p7",
    name:"Cold Drink",
    price:50,
    category:"Drinks",
    emoji:"🥤"
  },
  {
    id:"p8",
    name:"Water Bottle",
    price:20,
    category:"Drinks",
    emoji:"💧"
  }
];


let cart = [];

let currentCategory = "All";


/* =========================================================
   PRODUCT DISPLAY
   ========================================================= */

function renderProducts(list=products){

  const box = document.getElementById("productList");

  box.innerHTML = "";

  list.forEach(product => {

    box.innerHTML += `

      <div class="product">

        <div class="product-img">
          ${product.emoji}
        </div>

        <h3>${product.name}</h3>

        <div class="price">
          ₹${product.price}
        </div>

        <small>${product.category}</small>

        <br><br>

        <button class="add-btn"
          onclick="addToCart('${product.id}')">

          Add

        </button>

      </div>

    `;

  });

}


/* =========================================================
   SEARCH
   ========================================================= */

window.searchProducts = function(){

  const text =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  let result = products.filter(p => {

    const matchText =
      p.name.toLowerCase().includes(text);

    const matchCategory =
      currentCategory === "All" ||
      p.category === currentCategory;

    return matchText && matchCategory;

  });

  renderProducts(result);

};


/* =========================================================
   CATEGORY
   ========================================================= */

window.filterCategory = function(category,button){

  currentCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(x => x.classList.remove("active"));

  button.classList.add("active");

  searchProducts();

};


/* =========================================================
   CART
   ========================================================= */

window.addToCart = function(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  const existing =
    cart.find(x => x.id === id);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }

  renderCart();

};


window.changeQty = function(id,change){

  const item =
    cart.find(x => x.id === id);

  if(!item) return;

  item.qty += change;

  if(item.qty <= 0){

    cart =
      cart.filter(x => x.id !== id);

  }

  renderCart();

};


function renderCart(){

  const box =
    document.getElementById("cartList");

  box.innerHTML = "";

  let total = 0;

  if(cart.length === 0){

    box.innerHTML =
      "<p>Your cart is empty.</p>";

  }

  cart.forEach(item => {

    const amount =
      item.price * item.qty;

    total += amount;

    box.innerHTML += `

      <div class="cart-item">

        <div>

          <b>${item.name}</b>

          <br>

          ₹${item.price} × ${item.qty}

        </div>

        <div class="qty">

          <button
            onclick="changeQty('${item.id}',-1)">
            −
          </button>

          <b>${item.qty}</b>

          <button
            onclick="changeQty('${item.id}',1)">
            +
          </button>

        </div>

      </div>

    `;

  });

  document.getElementById("cartTotal").textContent =
    total;

}


/* =========================================================
   LOGIN
   ========================================================= */

window.openLogin = function(){

  document
    .getElementById("loginModal")
    .classList.remove("hidden");

};


window.openSignup = function(){

  closeModal("loginModal");

  document
    .getElementById("signupModal")
    .classList.remove("hidden");

};


window.loginUser = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){

    message.textContent =
      "Email aur password bharo.";

    return;

  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    message.textContent =
      "Login successful.";

    closeModal("loginModal");

  }catch(error){

    message.textContent =
      error.message;

  }

};


/* =========================================================
   SIGNUP
   ========================================================= */

window.signupUser = async function(){

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const message =
    document.getElementById("signupMessage");

  if(!name || !email || !password){

    message.textContent =
      "Sabhi fields bharo.";

    return;

  }

  if(password.length < 6){

    message.textContent =
      "Password kam se kam 6 characters ka hona chahiye.";

    return;

  }

  try{

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(
      result.user,
      {
        displayName:name
      }
    );

    message.textContent =
      "Account successfully created.";

    closeModal("signupModal");

  }catch(error){

    message.textContent =
      error.message;

  }

};


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

window.forgotPassword = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();

  if(!email){

    alert("Pehle email address enter karo.");

    return;

  }

  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    alert(
      "Password reset link tumhare email par bhej diya gaya hai."
    );

  }catch(error){

    alert(error.message);

  }

};


/* =========================================================
   LOGOUT
   ========================================================= */

window.logoutUser = async function(){

  await signOut(auth);

  closeModal("accountModal");

  alert("Logout successful.");

};


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(auth,user => {

  const loginButton =
    document.querySelector(".header-btn");

  if(user){

    loginButton.textContent =
      "Account";

    loginButton.onclick =
      openAccount;

    if(
      ADMIN_EMAILS.includes(
        user.email.toLowerCase()
      )
    ){

      document
        .getElementById("adminSection")
        .classList.remove("hidden");

    }

  }else{

    loginButton.textContent =
      "Login";

    loginButton.onclick =
      openLogin;

    document
      .getElementById("adminSection")
      .classList.add("hidden");

  }

});


/* =========================================================
   CHECKOUT
   ========================================================= */

window.openCheckout = function(){

  if(cart.length === 0){

    alert("Cart empty hai.");

    return;

  }

  if(!auth.currentUser){

    alert("Order karne ke liye login karo.");

    openLogin();

    return;

  }

  document
    .getElementById("checkoutModal")
    .classList.remove("hidden");

};


window.placeOrder = async function(){

  const user = auth.currentUser;

  if(!user){

    alert("Please login first.");

    return;

  }

  if(cart.length === 0){

    alert("Cart empty hai.");

    return;

  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const payment =
    document.getElementById("paymentMethod").value;

  if(!name || !phone || !address){

    alert("Name, mobile aur address bharo.");

    return;

  }

  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.price * item.qty,
      0
    );

  try{

    await addDoc(
      collection(db,"orders"),
      {

        userId:user.uid,

        userEmail:user.email,

        customerName:name,

        phone:phone,

        address:address,

        paymentMethod:payment,

        items:cart,

        total:total,

        status:"Order Confirmed",

        createdAt:serverTimestamp()

      }
    );

    cart = [];

    renderCart();

    closeModal("checkoutModal");

    alert(
      "Order successfully placed."
    );

    showSection("orders");

    loadMyOrders();

  }catch(error){

    alert(
      "Order error: " +
      error.message
    );

  }

};


/* =========================================================
   MY ORDERS
   ========================================================= */

window.loadMyOrders = async function(){

  const user = auth.currentUser;

  const box =
    document.getElementById("ordersList");

  if(!user){

    box.innerHTML =
      "<p>Please login to see your orders.</p>";

    return;

  }

  box.innerHTML =
    "<p>Loading orders...</p>";

  try{

    const q =
      query(
        collection(db,"orders"),
        where(
          "userId",
          "==",
          user.uid
        )
      );

    const snapshot =
      await getDocs(q);

    box.innerHTML = "";

    if(snapshot.empty){

      box.innerHTML =
        "<p>No orders found.</p>";

      return;

    }

    snapshot.forEach(orderDoc => {

      const order =
        orderDoc.data();

      const id =
        orderDoc.id;

      box.innerHTML += `

        <div class="order">

          <b>Order ID:</b> ${id}

          <br><br>

          <b>Total:</b> ₹${order.total}

          <br>

          <b>Payment:</b> ${order.paymentMethod}

          <br>

          <b>Address:</b> ${order.address}

          <br>

          <span class="status">
            ${order.status || "Order Confirmed"}
          </span>

          <div class="track">

            <div class="track-row">
              <span class="dot active"></span>
              Order Confirmed
            </div>

            <div class="track-row">
              <span class="dot ${
                order.status === "Out for Delivery" ||
                order.status === "Delivered"
                  ? "active"
                  : ""
              }"></span>
              Out for Delivery
            </div>

            <div class="track-row">
              <span class="dot ${
                order.status === "Delivered"
                  ? "active"
                  : ""
              }"></span>
              Delivered
            </div>

          </div>

        </div>

      `;

    });

  }catch(error){

    box.innerHTML =
      "<p>Error loading orders.</p>";

  }

};


/* =========================================================
   DELIVERY PANEL
   ========================================================= */

window.loadDeliveryOrders = async function(){

  const box =
    document.getElementById("deliveryOrders");

  box.innerHTML =
    "<p>Loading...</p>";

  try{

    const snapshot =
      await getDocs(
        collection(db,"orders")
      );

    box.innerHTML = "";

    snapshot.forEach(orderDoc => {

      const order =
        orderDoc.data();

      const id =
        orderDoc.id;

      box.innerHTML += `

        <div class="order">

          <b>Order:</b> ${id}

          <br>

          <b>Customer:</b>
          ${order.customerName}

          <br>

          <b>Phone:</b>
          ${order.phone}

          <br>

          <b>Address:</b>
          ${order.address}

          <br>

          <b>Status:</b>
          ${order.status}

          <br><br>

          <button
            class="primary"
            onclick="updateOrderStatus('${id}','Out for Delivery')">

            Accept / Out for Delivery

          </button>

          <button
            class="primary"
            onclick="updateOrderStatus('${id}','Delivered')">

            Mark Delivered

          </button>

        </div>

      `;

    });

  }catch(error){

    box.innerHTML =
      "<p>Error loading delivery orders.</p>";

  }

};


window.updateOrderStatus = async function(
  id,
  status
){

  try{

    await updateDoc(
      doc(db,"orders",id),
      {
        status:status
      }
    );

    alert(
      "Order status updated."
    );

    loadDeliveryOrders();

    loadMyOrders();

  }catch(error){

    alert(
      error.message
    );

  }

};


/* =========================================================
   ADMIN ORDERS
   ========================================================= */

window.loadAdminOrders = async function(){

  const user = auth.currentUser;

  if(
    !user ||
    !ADMIN_EMAILS.includes(
      user.email.toLowerCase()
    )
  ){

    alert("Admin access required.");

    return;

  }

  const box =
    document.getElementById("adminOrders");

  box.innerHTML =
    "<p>Loading...</p>";

  try{

    const snapshot =
      await getDocs(
        collection(db,"orders")
      );

    box.innerHTML = "";

    snapshot.forEach(orderDoc => {

      const order =
        orderDoc.data();

      const id =
        orderDoc.id;

      box.innerHTML += `

        <div class="admin-card">

          <b>Order ID:</b>
          ${id}

          <br><br>

          <b>Customer:</b>
          ${order.customerName}

          <br>

          <b>Email:</b>
          ${order.userEmail}

          <br>

          <b>Phone:</b>
          ${order.phone}

          <br>

          <b>Address:</b>
          ${order.address}

          <br>

          <b>Total:</b>
          ₹${order.total}

          <br>

          <b>Status:</b>
          ${order.status}

          <br><br>

          <button
            class="primary"
            onclick="updateOrderStatus('${id}','Out for Delivery')">

            Out for Delivery

          </button>

          <button
            class="primary"
            onclick="updateOrderStatus('${id}','Delivered')">

            Delivered

          </button>

        </div>

      `;

    });

  }catch(error){

    box.innerHTML =
      "<p>Admin error: " +
      error.message +
      "</p>";

  }

};

window.showSection = function(section){

  document
    .getElementById("homeSection")
    .classList.add("hidden");

  document
    .getElementById("cartSection")
    .classList.add("hidden");

  document
    .getElementById("ordersSection")
    .classList.add("hidden");

  document
    .getElementById("deliverySection")
    .classList.add("hidden");

  document
    .getElementById("adminSection")
    .classList.add("hidden");

  if(section === "home"){

    document
      .getElementById("homeSection")
      .classList.remove("hidden");

  }

  if(section === "cart"){

    document
      .getElementById("cartSection")
      .classList.remove("hidden");

    renderCart();

  }

  if(section === "orders"){

    document
      .getElementById("ordersSection")
      .classList.remove("hidden");

    loadMyOrders();

  }

  if(section === "delivery"){

    document
      .getElementById("deliverySection")
      .classList.remove("hidden");

    loadDeliveryOrders();

  }

  if(section === "admin"){

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    loadAdminOrders();

  }

};


window.openAccount = function(){

  const user =
    auth.currentUser;

  if(!user){

    openLogin();

    return;

  }

  document
    .getElementById("accountInfo")
    .innerHTML = `

      <p><b>Name:</b>
      ${user.displayName || "Customer"}</p>

      <p><b>Email:</b>
      ${user.email}</p>

    `;

  document
    .getElementById("accountModal")
    .classList.remove("hidden");

};


window.openOrdersFromAccount = function(){

  closeModal("accountModal");

  showSection("orders");

};


window.closeModal = function(id){

  document
    .getElementById(id)
    .classList.add("hidden");

};


window.closeModal = closeModal;
